# SpiderNetOS — Atlas voice persona catalogue (plan D7 §7, slice 0) — v2
#
# Jason (2026-09-16): "I do not like any of the Azure voice options." Every Azure persona has been
# removed. The Azure renderer stays in voice_previews.py behind --include-azure (providers.azure
# below is disabled_by_default) for any future catalogue that lists Azure voices.
#
# Jason (2026-09-19): "They do not need to be African voices, just avoid basic white american voices."
# The Sub-Saharan set stays and is still where the Atlas default candidate sits; alongside it the
# catalogue now carries British Isles (RP, Northern, Scottish, Irish, Welsh), South Asian, Caribbean,
# Australasian, South-East Asian and Black British / African-American voices. The one American entry
# left is the Piper dev baseline, which is the offline fallback, not an Atlas candidate.
#
# Read by inference/voice_previews.py (renders the listening page) and, in PR 5, by
# VoicePersonaSeeder into the voice_personas table. One entry per candidate voice.
#
# Fields: slug, display_name, provider (elevenlabs|fishaudio|intron|piper|azure), provider_voice_id,
#   language, accent, gender, style, style_degree, rate, pitch, output_format,
#   cost_per_1k_chars (null = unverified — re-check pricing before setting),
#   tags[], recommended_for[] (atlas | board:<seat> | character:<slug>), consent {type: stock}.
# Optional: kind: design (ElevenLabs Voice Design candidate: voice_description, design_model_id, seed),
#   discover {accent|title, language} for placeholders, fish_model, intron {voice_language,
#   voice_accent, voice_gender}, notes.
#
# Providers and what they need (endpoints verified against vendor docs 2026-09-16):
#   elevenlabs  ELEVENLABS_API_KEY   POST /v1/text-to-speech/{id} (eleven_multilingual_v2);
#                                    GET /v1/shared-voices?accent=…; POST /v1/text-to-voice/design
#                                    (eleven_multilingual_ttv_v2) -> previews[]{audio_base_64, generated_voice_id}
#   fishaudio   FISH_AUDIO_API_KEY   POST https://api.fish.audio/v1/tts, header model: s2.1-pro, reference_id;
#                                    GET https://api.fish.audio/model?title=… (public library)
#   intron      INTRON_API_KEY       POST https://infer.voice.intron.io/tts/v1/enqueue -> data.text_id;
#                                    GET …/tts/v1/status/{text_id} -> TTS_TEXT_AUDIO_GENERATED + audio_path
#   piper       PIPER_URL            local HTTP server, POST /synthesize (as speech.py)
#   azure       AZURE_SPEECH_KEY + AZURE_SPEECH_REGION — disabled by default, no personas listed
#
# Board seats (D7 §6): offer_architect, producer, leverage_philosopher, compounder, greenlight;
# the chairman uses the tenant's Atlas persona. Characters (D5): hannah, forge, sentinel, prism, nexus.
# Atlas default candidate: elevenlabs-design-zimbabwean-man. Seats are spread across providers; the
# first persona in file order that lists a seat is the one the page preselects.

version: 2
sample_lines_note: Rendered lines live in inference/voice_previews.py (SAMPLE_LINES); voice design uses all three
  in one clip.
providers:
  elevenlabs:
    env:
    - ELEVENLABS_API_KEY
    disabled_by_default: false
  fishaudio:
    env:
    - FISH_AUDIO_API_KEY
    disabled_by_default: false
    model: s2.1-pro
  intron:
    env:
    - INTRON_API_KEY
    disabled_by_default: false
  piper:
    env:
    - PIPER_URL
    disabled_by_default: false
  azure:
    env:
    - AZURE_SPEECH_KEY
    - AZURE_SPEECH_REGION
    disabled_by_default: true
    note: Removed at Jason's request (2026-09-16). Renderer kept; pass --include-azure to enable.
