version: '3.8'

services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    networks:
      - spidernet

  laravel:
    image: spidernet-laravel:latest
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: spidernet
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis
    networks:
      - spidernet

  cockpit:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install && npm run build && npx serve -s dist -l 3000"
    ports:
      - "3000:3000"
    volumes:
      - ./cockpit:/app
    networks:
      - spidernet
    depends_on:
      - laravel

  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: spidernet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - spidernet

  redis:
    image: redis:7-alpine
    networks:
      - spidernet

volumes:
  caddy_data:
  pg_data:

networks:
  spidernet:
    driver: bridge
