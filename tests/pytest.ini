[pytest]
# Markers are registered so an unknown one is an error rather than a warning
# that everybody scrolls past.
markers =
    unit: no external dependency, runs on every pull request
    integration: needs testcontainers (Postgres, Redis, Kafka); scheduled only
    chaos: kills real infrastructure; scheduled only
    smoke: needs a running SpiderNetOS; scheduled only
asyncio_mode = auto
# Default to the lane that needs no infrastructure. The scheduled
# workflow passes integration/chaos/client explicitly.
testpaths = unit behavioral
