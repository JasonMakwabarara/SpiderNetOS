# gitleaks configuration — SpiderNet OS Tier 1
# Inherits the default ruleset and adds project-specific allowlist entries
# so test fixtures and the hardened .env.example don't create false positives.

[extend]
useDefault = true

[allowlist]
description = "Project-specific false positives"
paths = [
  # .env.example no longer carries a real APP_KEY (Batch A), but the
  # pattern-match heuristic in default rules still trips on the
  # commented example. The allowlist entry below keeps the file scannable
  # while explicitly trusting it.
  '''^\.env\.example$''',

  # Test fixtures contain deliberately-fake tokens / JWTs for unit tests.
  '''^backend/tests/.*$''',
  '''^intelligence/tests/.*$''',
  '''^inference/tests/.*$''',
]

regexes = [
  # Laravel test helper — not a real key.
  '''base64:testing-only-[A-Za-z0-9+/=]+''',
  # Twilio test account SID prefix (AC followed by zeros).
  '''AC0{32}''',
]

# gitleaks' default ruleset is built around high-entropy strings and vendor
# prefixes, so it cannot see a database password that happens to be a dictionary
# word. GitGuardian caught a bare PGPASSWORD literal on a psql command line in
# a workflow and gitleaks did not; this closes that gap in the scanner we
# actually control.
#
# Deliberately narrow: it matches a *literal* only. An expansion —
# PGPASSWORD="$DB_PASSWORD", PGPASSWORD="${{ secrets.X }}",
# PGPASSWORD="${DB_PASSWORD:-postgres}" — begins with a quote or a dollar and is
# not matched, because sourcing a credential from the environment is the fix
# this rule is pushing people towards.
[[rules]]
id = "inline-db-password-literal"
description = "Database password written as a literal on the command line"
regex = '''\b(PGPASSWORD|MYSQL_PWD|PGPASS)=(?:[^\s$'"=]+)'''
tags = ["database", "password", "cleartext"]
