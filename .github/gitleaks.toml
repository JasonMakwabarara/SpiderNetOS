# gitleaks configuration — SpiderNet OS Tier 1
# Inherits the default ruleset and adds project-specific allowlist entries
# so test fixtures and the hardened .env.example don't create false positives.

[extend]
useDefault = true

[allowlist]
description = "Project-specific false positives"
paths = [
  # .env.example no longer carries a real APP_KEY (Batch A), but the
  # pattern-match heuristic in default rules still trips on the
  # commented example. The allowlist entry below keeps the file scannable
  # while explicitly trusting it.
  '''^\.env\.example$''',

  # Test fixtures contain deliberately-fake tokens / JWTs for unit tests.
  '''^backend/tests/.*$''',
  '''^intelligence/tests/.*$''',
  '''^inference/tests/.*$''',
]

regexes = [
  # Laravel test helper — not a real key.
  '''base64:testing-only-[A-Za-z0-9+/=]+''',
  # Twilio test account SID prefix (AC followed by zeros).
  '''AC0{32}''',
]
