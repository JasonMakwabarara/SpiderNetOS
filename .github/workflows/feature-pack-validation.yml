name: Feature Pack Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-packs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, xml, curl, zip

      - name: Install Composer dependencies
        run: |
          cd backend
          composer install --prefer-dist --no-interaction --no-progress

      - name: Check if pack-validate command exists
        run: |
          cd backend
          php artisan list | grep pack-validate || echo "Command not found"

      - name: Validate feature packs with Artisan
        run: |
          cd backend
          php artisan spidernet:pack-validate || exit 0

      - name: Validate feature packs with Python script (fallback)
        run: |
          if [ -f "scripts/validate_feature_pack.py" ]; then
            python3 scripts/validate_feature_pack.py || exit 0
          else
            echo "?? No validation script found. Skipping."
          fi
