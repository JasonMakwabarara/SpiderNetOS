name: Frontend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
      # This is an npm workspace: the root owns the lockfile and the install
      # tree. Running npm from cockpit/ installs the whole workspace at the
      # root regardless, so say so rather than relying on npm walking up.
      - run: npm ci
      - run: npm run build --workspace=cockpit
