name: Frontend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]


# A newer push to the same PR supersedes this run, so the older one is
# cancelled rather than finishing work nobody will read. `github.workflow` is
# in the group on purpose: without it, workflows sharing a branch cancel each
# other and Backend CI would kill Frontend CI.
#
# Safe here because all four of these only read, build or test against
# ephemeral service containers — interrupting one leaves nothing behind.
# Deliberately NOT applied to atlas-training-refresh-nightly.yml, which holds
# `contents: write` and ends in git add/commit/push: cancelling that mid-run
# risks a partial refresh, and being schedule-driven it has nothing to gain.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
      # This is an npm workspace: the root owns the lockfile and the install
      # tree. Running npm from cockpit/ installs the whole workspace at the
      # root regardless, so say so rather than relying on npm walking up.
      - run: npm ci
      - run: npm run build --workspace=cockpit
