name: Frontend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
      # This is an npm workspace: the root owns the lockfile and the install
      # tree. Running npm from cockpit/ installs the whole workspace at the
      # root regardless, so say so rather than relying on npm walking up.
      - run: npm ci
      - run: npm run build --workspace=cockpit
