name: Python CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      # Pinned to match ci.yml's blocking ruff jobs, and no longer swallowed:
      # `ruff check ... || echo` reported findings into the void and exited 0,
      # so this job was green for years without linting anything.
      - run: pip install ruff==0.6.9
      - run: |
          if [ -d "intelligence" ]; then
            ruff check intelligence/
          fi
      - run: |
          if [ -d "inference" ]; then
            ruff check inference/
          fi
