name: Python CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: |
          if [ -d "intelligence" ]; then
            ruff check intelligence/ || echo "?? Ruff found issues in intelligence/"
          fi
      - run: |
          if [ -d "inference" ]; then
            ruff check inference/ || echo "?? Ruff found issues in inference/"
          fi
