name: Python CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      # Pinned to match ci.yml's blocking ruff jobs, and no longer swallowed:
      # `ruff check ... || echo` reported findings into the void and exited 0,
      # so this job was green for years without linting anything.
      - run: pip install ruff==0.6.9
      - run: |
          if [ -d "intelligence" ]; then
            ruff check intelligence/
          fi
      - run: |
          if [ -d "inference" ]; then
            ruff check inference/
          fi

  # 137 tests across the two planes that no workflow had ever run: 98 in
  # intelligence, 39 in inference. They pass; they just were not wired to
  # anything.
  pytest:
    name: python planes — pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [intelligence, inference]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt
      - name: Install
        working-directory: ${{ matrix.project }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Tests
        working-directory: ${{ matrix.project }}
        run: python -m pytest tests/ -q

  # tests/ at the repo root. Referenced by no workflow until now, and the only
  # one of the four unwired suites that had actually rotted.
  repo-suites:
    name: repo suites — unit + behavioural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install
        run: pip install -r tests/requirements.txt
      - name: Tests
        working-directory: tests
        run: python -m pytest -q

