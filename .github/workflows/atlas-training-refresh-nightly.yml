name: Atlas Training Refresh (Nightly)

on:
  schedule:
    - cron: "0 1 * * *"
  push:
    branches:
      - main
    paths:
      - "training_data/transcripts/**/*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-atlas-training:
    runs-on: ubuntu-latest
    env:
      TRANSCRIPT_DIR: training_data/transcripts
      ATLAS_DIR: intelligence/atlas/training/current
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Detect latest transcript export
        id: detect
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          transcript_dir = Path("training_data/transcripts")
          atlas_dir = Path("intelligence/atlas/training/current")
          hash_file = atlas_dir / "source_hash.txt"

          exports = sorted(transcript_dir.rglob("*.md"), key=lambda p: p.stat().st_mtime, reverse=True)
          github_output = os.environ["GITHUB_OUTPUT"]
          if not exports:
            with open(github_output, "a", encoding="utf-8") as f:
              f.write("has_input=false\n")
            raise SystemExit(0)

          latest = exports[0]
          digest = hashlib.sha256(latest.read_bytes()).hexdigest()
          previous = hash_file.read_text(encoding="utf-8").strip() if hash_file.exists() else ""
          changed = digest != previous

          with open(github_output, "a", encoding="utf-8") as f:
            f.write("has_input=true\n")
            f.write(f"changed={'true' if changed else 'false'}\n")
            f.write(f"latest_export={latest.as_posix()}\n")
            f.write(f"latest_hash={digest}\n")
          PY

      - name: Stop when no transcript exports exist
        if: steps.detect.outputs.has_input != 'true'
        run: echo "No transcript markdown files found in ${TRANSCRIPT_DIR}. Skipping."

      - name: Stop when latest export is unchanged
        if: steps.detect.outputs.has_input == 'true' && steps.detect.outputs.changed != 'true'
        run: echo "Latest transcript export unchanged. Skipping refresh."

      - name: Build training bundle from latest export
        if: steps.detect.outputs.has_input == 'true' && steps.detect.outputs.changed == 'true'
        run: |
          python scripts/convert_cursor_markdown_to_jsonl.py \
            --input "${{ steps.detect.outputs.latest_export }}" \
            --out-dir training_data/atlas \
            --min-quality 2 \
            --min-quality-sft 2 \
            --quality-report

      - name: Gate bundle quality
        if: steps.detect.outputs.has_input == 'true' && steps.detect.outputs.changed == 'true'
        run: |
          python scripts/eval_training_data_quality.py \
            --sft training_data/atlas/sft.jsonl \
            --preference training_data/atlas/preference.jsonl \
            --min-quality 2 \
            --min-sft-rows 20 \
            --min-preference-rows 20 \
            --min-distinct-preference-ratio 0.95

      - name: Refresh Atlas training directory
        if: steps.detect.outputs.has_input == 'true' && steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          mkdir -p "${ATLAS_DIR}"
          cp training_data/atlas/sft.jsonl "${ATLAS_DIR}/sft.jsonl"
          cp training_data/atlas/preference.jsonl "${ATLAS_DIR}/preference.jsonl"
          cp training_data/atlas/quality_gate.json "${ATLAS_DIR}/quality_gate.json"
          if [ -f training_data/atlas/quality_report.json ]; then
            cp training_data/atlas/quality_report.json "${ATLAS_DIR}/quality_report.json"
          fi
          printf '%s\n' "${{ steps.detect.outputs.latest_hash }}" > "${ATLAS_DIR}/source_hash.txt"
          printf '%s\n' "${{ steps.detect.outputs.latest_export }}" > "${ATLAS_DIR}/source_export_path.txt"

      - name: Commit and push refresh
        if: steps.detect.outputs.has_input == 'true' && steps.detect.outputs.changed == 'true'
        shell: bash
        # Context data reaches the shell through the environment, never through
        # ${{ }} interpolation into the script itself.
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${ATLAS_DIR}/sft.jsonl" "${ATLAS_DIR}/preference.jsonl" "${ATLAS_DIR}/quality_gate.json" "${ATLAS_DIR}/quality_report.json" "${ATLAS_DIR}/source_hash.txt" "${ATLAS_DIR}/source_export_path.txt" || true
          if git diff --cached --quiet; then
            echo "No Atlas training changes to commit."
            exit 0
          fi
          git commit -m "chore(atlas): nightly refresh training bundle"
          git push origin "HEAD:$TARGET_REF"
