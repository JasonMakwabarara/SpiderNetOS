name: Integration suites (nightly)

# tests/integration brings up Postgres, Redis and Kafka through testcontainers;
# tests/chaos kills real infrastructure; tests/client needs a running
# SpiderNetOS. None of that belongs on a pull request, but running them never
# is how tests/ came to have a test importing a module name that has never
# existed. Nightly, and on demand.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: tests/integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tests/requirements-integration.txt
      - name: Install
        run: pip install -r tests/requirements-integration.txt
      - name: Tests
        working-directory: tests
        run: python -m pytest integration -q
