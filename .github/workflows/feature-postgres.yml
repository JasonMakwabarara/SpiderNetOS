name: Full Feature Suite (Postgres)

# Runs the ENTIRE backend test suite (Unit + Feature) against real Postgres 16
# + pgvector — the lane that caught the cross-tenant delegation leak and the
# VoiceNumber fillable gap. CiFast (sqlite, pure unit) stays in ci.yml for
# speed; this is the correctness gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  feature-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: spidernet_test
          POSTGRES_USER: spidernet
          POSTGRES_PASSWORD: spidernet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spidernet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      # Real env vars win over phpunit.github-full.xml's non-forced <env>
      # entries, so only the host/redis need overriding for runner networking.
      DB_HOST: 127.0.0.1
      REDIS_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_pgsql, redis, sodium
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare app
        run: |
          cp .env.example .env 2>/dev/null || touch .env
          php artisan key:generate --force

      - name: Enable pgvector
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=spidernet psql -h 127.0.0.1 -U spidernet -d spidernet_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run full suite (Unit + Feature) on Postgres
        # `artisan test` supplies its own --configuration, so passing one here was
        # a duplicate option: PHPUnit warned and the step exited 1 even when every
        # test passed. Call phpunit directly, the way ci.yml already does.
        run: ./vendor/bin/phpunit -c phpunit.github-full.xml
