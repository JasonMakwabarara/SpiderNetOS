name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: backend — lint + static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --prefer-dist --no-progress --no-interaction
      - name: Pint (code style)
        run: vendor/bin/pint --test --format=checkstyle | cs2pr
      - name: Larastan (static analysis, baseline-gated)
        run: php vendor/bin/phpstan.phar analyse --memory-limit=1G --no-progress --error-format=github

  backend-test-ci-fast:
    name: backend — PHPUnit (CiFast)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, pdo_sqlite, bcmath
          coverage: none
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --prefer-dist --no-progress --no-interaction
      - name: CiFast tests (no Redis / no pgvector migrations)
        run: php artisan test --testsuite=CiFast

  feature-pack-validate:
    name: feature-pack — manifest validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml==6.0.1
      - name: Validate reference pack
        run: python scripts/validate_feature_pack.py packages/feature-packs/real-estate-crm/pack.yaml

  cockpit-build:
    name: cockpit — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cockpit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cockpit/package-lock.json
      - run: npm ci --prefer-offline --no-audit
      - name: Type check / lint (best-effort; non-blocking until configured)
        run: |
          if npm run | grep -q 'lint'; then npm run lint; else echo "No lint script"; fi
      - name: Build
        run: npm run build

  python-lint:
    name: python planes — ruff
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [intelligence, inference]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Ruff check
        working-directory: ${{ matrix.project }}
        run: ruff check . --output-format=github

  services-ruff:
    name: services — ruff (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Ruff check services/
        working-directory: services
        run: ruff check . --output-format=github

  backend-test-full:
    name: backend — full test suite (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: spidernet
          POSTGRES_PASSWORD: spidernet
          POSTGRES_DB: spidernet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, pdo_pgsql, bcmath
          coverage: none
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --prefer-dist --no-progress --no-interaction
      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -U spidernet -d spidernet_test; do
            sleep 1
          done
      - name: Migrate
        run: php artisan migrate --force
      - name: Run full PHPUnit suite
        run: ./vendor/bin/phpunit -c phpunit.github-full.xml
