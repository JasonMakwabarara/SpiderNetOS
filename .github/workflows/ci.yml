name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify project structure
        run: |
          echo "=== SpiderNetOS Project Structure ==="
          ls -la
          echo ""
          echo "Checking backend..."
          ls -la backend/ || echo "?? Backend folder not found"
          echo ""
          echo "Checking cockpit..."
          ls -la cockpit/ || echo "?? Cockpit folder not found"
          echo "? CI checks passed"
