name: Python CI
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: if [ -d "intelligence" ]; then ruff check intelligence/ || true; fi
      - run: if [ -d "inference" ]; then ruff check inference/ || true; fi
