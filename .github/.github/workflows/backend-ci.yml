name: Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spidernet_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, mbstring, xml, curl, zip, bcmath
      - run: cd backend && composer install --prefer-dist --no-interaction --no-progress
      - run: cd backend && cp .env.example .env && sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=pgsql/' .env && sed -i 's/DB_DATABASE=.*/DB_DATABASE=spidernet_test/' .env && sed -i 's/DB_USERNAME=.*/DB_USERNAME=postgres/' .env && sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=postgres/' .env && sed -i 's/REDIS_HOST=.*/REDIS_HOST=redis/' .env
      - run: cd backend && php artisan key:generate && php artisan migrate --force
      - run: cd backend && ./vendor/bin/phpunit --configuration phpunit.github-full.xml
