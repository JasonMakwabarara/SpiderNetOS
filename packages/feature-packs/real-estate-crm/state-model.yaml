# Lead Lifecycle State Model
# Chain: pack.real-estate-crm.lead_lifecycle

chains:
  - id: lead_lifecycle
    namespace: pack.real-estate-crm
    description: "Lead state progression from initial capture through close or loss"

    states:
      - captured      # Initial form submission
      - qualified     # Scored and prioritized
      - contacted     # Agent has reached out
      - scheduled     # Viewing appointment set
      - offer         # Offer received
      - negotiate     # Counter offers in progress
      - closed        # Deal completed
      - archived      # Past client, relationship maintained
      - lost          # Opportunity ended without close

    transitions:
      # Entry points
      - event: lead.form.submitted
        from: null
        to: captured

      - event: lead.referral.received
        from: null
        to: captured

      # Forward progression
      - event: lead.score.calculated
        from: captured
        to: qualified

      - event: agent.assigned
        from: qualified
        to: contacted

      - event: viewing.confirmed
        from: contacted
        to: scheduled

      - event: offer.received
        from: scheduled
        to: offer

      - event: counter.offer.sent
        from: offer
        to: negotiate

      - event: offer.accepted
        from: [offer, negotiate]
        to: closed

      # Post-close
      - event: follow_up.completed
        from: closed
        to: archived

      # Exit points
      - event: opportunity.lost
        from: [captured, qualified, contacted, scheduled, offer, negotiate]
        to: lost
        tags:
          extract:
            - reason: "payload.loss_reason"
            - stage: "from_state"

      # Re-activation
      - event: lead.re_engaged
        from: [archived, lost]
        to: contacted
        tags:
          extract:
            - reactivation_source: "payload.source"
