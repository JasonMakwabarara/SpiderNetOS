id: offer-pipeline
description: "Track offers from submission through negotiation to close"
displayName: "Offer Pipeline"

nodes:
  # Entry
  - id: offer_received
    type: trigger
    event: offer.submitted
    description: "New offer received on a property"

  # Log and notify
  - id: log_offer
    type: agent
    agent: crm
    action: log_offer_details

  - id: notify_seller
    type: notification
    recipient: seller
    message: "New offer received: {{offer.amount}} on {{property.address}}"

  # Qualify the offer
  - id: qualify_offer
    type: agent
    agent: crm
    action: qualify_offer
    description: "Check financing, contingencies, timeline"

  # Decision branch
  - id: evaluate_offer
    type: decision
    branches:
      - id: strong_offer
        condition: offer_score >= 80
      - id: fair_offer
        condition: offer_score >= 50
      - id: weak_offer
        condition: offer_score < 50

  # Strong: accept immediately
  - id: accept_strong
    type: agent
    agent: crm
    action: recommend_acceptance
    condition: strong_offer

  # Fair: counter
  - id: prepare_counter
    type: agent
    agent: crm
    action: prepare_counter_offer
    condition: fair_offer

  # Weak: reject with explanation
  - id: prepare_rejection
    type: agent
    agent: crm
    action: prepare_rejection_with_feedback
    condition: weak_offer

  # Await response to counter
  - id: await_counter_response
    type: wait
    timeout: 48h

  # Buyer accepts counter
  - id: move_to_contract
    type: agent
    agent: crm
    action: initiate_contract_process
    condition: counter_accepted

  # Buyer counters again
  - id: second_round_negotiation
    type: agent
    agent: crm
    action: evaluate_second_counter
    condition: counter_offered

  # Contract milestones
  - id: inspection_period
    type: scheduled
    trigger: "contract_signed"
    action: schedule_inspection_deadline

  - id: financing_contingency
    type: scheduled
    trigger: "contract_signed"
    action: track_financing_deadline

  - id: appraisal_check
    type: scheduled
    trigger: "10d_before_closing"
    action: confirm_appraisal_complete

  # Close or fail
  - id: closing_day
    type: scheduled
    trigger: "closing_date"
    action: confirm_funding_received

  - id: mark_closed
    type: agent
    agent: crm
    action: close_transaction
    description: "Move to closed state, update records"

  - id: mark_failed
    type: agent
    agent: crm
    action: log_deal_failure
    condition: deal_fell_through

  # Post-close
  - id: request_review
    type: agent
    agent: retention
    action: request_testimonial
    delay: "7d"

edges:
  # Main flow
  - from: offer_received
    to: log_offer

  - from: log_offer
    to: notify_seller

  - from: notify_seller
    to: qualify_offer

  - from: qualify_offer
    to: evaluate_offer

  # Branches
  - from: evaluate_offer
    to: accept_strong
    condition: strong_offer

  - from: evaluate_offer
    to: prepare_counter
    condition: fair_offer

  - from: evaluate_offer
    to: prepare_rejection
    condition: weak_offer

  # Counter flow
  - from: prepare_counter
    to: await_counter_response

  - from: await_counter_response
    to: move_to_contract
    condition: counter_accepted

  - from: await_counter_response
    to: second_round_negotiation
    condition: counter_offered

  # Contract to close
  - from: move_to_contract
    to: inspection_period

  - from: inspection_period
    to: financing_contingency

  - from: financing_contingency
    to: appraisal_check

  - from: appraisal_check
    to: closing_day

  - from: closing_day
    to: mark_closed
    condition: funded

  - from: closing_day
    to: mark_failed
    condition: not_funded

  # Post-close
  - from: mark_closed
    to: request_review

on_error:
  action: notify_agent_and_seller
  message: "Offer pipeline stalled for {{property.id}}"
