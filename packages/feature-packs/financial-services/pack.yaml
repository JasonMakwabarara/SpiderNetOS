metadata:
  id: financial-services
  version: 1.0.0
  vertical: financial_services
  display_name: "Financial OS"
  description: >
    Comprehensive financial operating system for SpiderNetOS.
    Provides double-entry bookkeeping, invoicing, payment processing,
    portfolio management, financial reporting, budget tracking,
    and AI-powered financial analysis.

spec:
  provides:
    dynamic_agents:
      - id: finance-agent
        name: "Financial Analyst"
        capabilities:
          - ledger-query
          - report-generation
          - cash-flow-analysis
          - budget-optimization
          - invoice-chasing
          - forecasting
        prompt: |
          You are a financial analyst with access to the SpiderNetOS financial ledger,
          invoices, payments, and wallets. Help users query their financial data,
          generate reports, analyze cash flow, and optimize budgets.
          Use the available tools to provide accurate financial insights.

      - id: compliance-agent
        name: "Compliance Officer"
        capabilities:
          - transaction-monitoring
          - fraud-detection
          - kyc-screening
          - audit-trail
          - alert-management
        prompt: |
          You are a compliance officer monitoring financial transactions for suspicious
          activity. Analyze transaction patterns, detect potential fraud, and manage
          compliance alerts.

      - id: portfolio-agent
        name: "Portfolio Manager"
        capabilities:
          - portfolio-analysis
          - risk-assessment
          - trade-execution
          - performance-tracking
          - rebalancing
        prompt: |
          You are a portfolio manager with access to SpiderNetOS investment portfolios.
          Analyze portfolio performance, assess risk, execute trades, and provide
          rebalancing recommendations.

    ste_chains:
      - id: payment_lifecycle
        description: "Payment state machine: initiated -> processing -> completed/failed"
        states:
          - initiated
          - processing
          - completed
          - failed
          - refunded
        transitions:
          - from: initiated
            to: processing
            event: payment.processing
          - from: processing
            to: completed
            event: payment.completed
          - from: processing
            to: failed
            event: payment.failed
          - from: completed
            to: refunded
            event: payment.refunded

      - id: invoice_lifecycle
        description: "Invoice state machine: draft -> sent -> paid/cancelled"
        states:
          - draft
          - sent
          - paid
          - cancelled
          - overdue
        transitions:
          - from: draft
            to: sent
            event: invoice.sent
          - from: sent
            to: paid
            event: invoice.paid
          - from: sent
            to: overdue
            event: invoice.overdue
          - from: sent
            to: cancelled
            event: invoice.cancelled
          - from: overdue
            to: paid
            event: invoice.paid

    policies:
      - id: financial-transaction-approval
        description: "Require human approval for transactions above threshold"
        conditions:
          transaction_amount: "> 10000"
        action: "require_approval"

      - id: budget-enforcement
        description: "Block transactions when budget exceeded"
        conditions:
          budget_utilization: ">= 100"
        action: "block_with_alert"

  database:
    migrations:
      - 2026_05_07_000001_create_financial_accounts_table.php
      - 2026_05_07_000002_create_chart_of_accounts_table.php
      - 2026_05_07_000003_create_ledger_entries_table.php
      - 2026_05_07_000004_create_transactions_table.php
      - 2026_05_07_000005_create_invoices_table.php
      - 2026_05_07_000006_create_payments_table.php
      - 2026_05_07_000007_create_subscriptions_table.php
      - 2026_05_07_000008_create_wallets_table.php
      - 2026_05_07_000009_create_budgets_table.php
      - 2026_05_07_000010_create_customers_table.php
      - 2026_05_07_000011_create_tax_rates_table.php
      - 2026_05_07_000012_create_portfolios_table.php
      - 2026_05_07_000013_create_trades_table.php
      - 2026_05_07_000014_create_financial_reports_table.php
      - 2026_05_07_000015_create_financial_alerts_table.php

  routes:
    prefix: /api/financial
    groups:
      - ledger: /ledger
      - invoices: /invoices
      - payments: /payments
      - dashboard: /dashboard
      - reports: /reports
      - wallets: /wallets
      - budgets: /budgets
      - portfolios: /portfolios

  integrations:
    stripe:
      enabled: true
      adapter: App\Services\Integrations\StripeAdapter
    plaid:
      enabled: false
      note: "Future - bank account aggregation"
    flutterwave:
      enabled: false
      note: "Future - African payment processing"
