id: people
displayName: "People Operations"
description: "Maintains the tenant employee register: search, create, edit, and deactivate. Does not calculate leave, hours, or punctuality."
capabilities:
  - id: list_employees
    description: "Search and list employees for the current tenant"
  - id: create_employee
    description: "Create an employee. The employee number is generated by the server."
  - id: update_employee
    description: "Edit name, position, department, job description, and start date"
  - id: deactivate_employee
    description: "Deactivate an employee with an effective date and reason. Does not delete the record."
  - id: suggest_job_description
    description: "Suggest a job description from a position title using local templates"
