apiVersion: spidernet/v1
kind: FeaturePack

metadata:
  id: business-systemization
  version: 0.1.0
  vertical: horizontal
  displayName: "Business Systemization"
  description: "Map every task into systems with one owner each, interview SOPs into existence, and delegate smallest-first until the business runs without the founder"

spec:
  requires:
    core_agents: [atlas, hannah, forge]
    min_spidernet_version: 3.2.0

  provides:
    dynamic_agents:
      - id: systems-mapper
        displayName: "Systems Mapper"
        capabilities: [task_discovery, function_classification, goal_alignment]
      - id: sop-coach
        displayName: "SOP Coach"
        capabilities: [sop_interview, vague_answer_challenge, sop_drafting, sop_revision]
      - id: delegation-planner
        displayName: "Delegation Planner"
        capabilities: [snowball_ordering, ownership_tracking, handoff_briefs]

    flows:
      - id: systems-bootstrap
        description: "Seed the six core functions and interview the founder's task list"
      - id: sop-interview
        description: "Clarification interview that turns a task into a followable SOP"
      - id: delegation-handoff
        description: "Walk the new owner through the map, their responsibility, and the SOP"

    ste_chains:
      - id: process_ownership
        description: "Process state progression: founder_owned → documented → delegated/automated"

    targets:
      - metric: founder_owned_pct
        goal: "<= 0.2"
        baseline: 0.9
      - metric: processes_with_published_sop
        goal: ">= 0.8"
        baseline: 0.1
      - metric: weekly_review_minutes
        goal: "<= 10m"
        baseline: 600m

  config:
    default_automation_level: assisted
    enable_cross_tenant_learning: true

  signatures:
    publisher: "spidernet-official"
    signature: "placeholder-signature-to-be-generated"
