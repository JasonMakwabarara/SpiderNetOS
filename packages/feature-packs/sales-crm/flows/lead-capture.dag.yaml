id: lead-capture
description: "Capture, qualify, and route new leads"
displayName: "Lead Capture"

nodes:
  # Entry point
  - id: capture
    type: trigger
    event: pack.sales-crm.lead_lifecycle.captured
    description: "New lead enters the system"

  # Qualification
  - id: score
    type: agent
    agent: crm
    action: score_lead
    description: "Calculate lead score based on profile"
    timeout: 30s
    retry: 2

  # Routing decision
  - id: route
    type: decision
    condition: score >= 70
    branches:
      - id: high_score
        condition: score >= 70
      - id: medium_score
        condition: score >= 40
      - id: low_score
        condition: score < 40

  # High-score path: immediate agent assignment
  - id: assign_agent
    type: agent
    agent: crm
    action: assign_to_available_agent
    condition: high_score
    description: "Assign to best available team member"

  - id: notify_agent
    type: notification
    recipient: assigned_agent
    message: "High-value lead assigned: {{lead.name}}"
    condition: high_score

  # Medium-score path: nurture sequence
  - id: add_nurture
    type: agent
    agent: crm
    action: enroll_in_sequence
    condition: medium_score
    config:
      sequence_key: nurture-sequence

  # Low-score path: self-serve resources
  - id: send_resources
    type: agent
    agent: crm
    action: send_self_serve_resources
    condition: low_score

  # Always: log to growth analytics
  - id: log_conversion
    type: agent
    agent: growth
    action: log_conversion
    description: "Track lead source for campaign optimization"

  # Always: send welcome using the approved sales script opener
  - id: send_welcome
    type: agent
    agent: crm
    action: send_welcome_message

edges:
  # Main flow
  - from: capture
    to: score

  - from: score
    to: route

  # High score branch
  - from: route
    to: assign_agent
    condition: high_score

  - from: assign_agent
    to: notify_agent

  - from: notify_agent
    to: send_welcome

  # Medium score branch
  - from: route
    to: add_nurture
    condition: medium_score

  - from: add_nurture
    to: send_welcome

  # Low score branch
  - from: route
    to: send_resources
    condition: low_score

  # Always execute
  - from: capture
    to: log_conversion

on_error:
  action: notify_admin
  message: "Lead capture flow failed for {{lead.id}}"
