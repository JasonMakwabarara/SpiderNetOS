id: followup-timing
shared: true
description: "Optimal timing for lead follow-up messages"

variants:
  - id: immediate
    description: "Respond within 1 minute"
    timing: "0-1m"
    success_rate: 0.35
    alpha: 35
    beta: 65
    tags: [whatsapp, email]

  - id: quick
    description: "Respond within 5 minutes"
    timing: "1-5m"
    success_rate: 0.26
    alpha: 26
    beta: 74
    tags: [whatsapp, email]

  - id: standard
    description: "Respond within 15 minutes"
    timing: "5-15m"
    success_rate: 0.16
    alpha: 16
    beta: 84
    tags: [email]

  - id: slow
    description: "Respond within 1 hour"
    timing: "15-60m"
    success_rate: 0.09
    alpha: 9
    beta: 91
    tags: [email]

  - id: too_late
    description: "Respond after 1 hour"
    timing: ">60m"
    success_rate: 0.04
    alpha: 4
    beta: 96
    tags: [email]

aggregation:
  method: thompson_sampling
  exploration_rate: 0.15
  update_frequency: daily
