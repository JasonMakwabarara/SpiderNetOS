metadata:
  id: compliance-radar
  version: 0.1.0
  vertical: compliance
  display_name: "Compliance Radar"
  description: "SpiderNetOS learns your business and surfaces what you need to stay compliant — without jargon."
  customer_outcomes:
    - "Discover what compliance applies to your business"
    - "Plain-English obligations — no jargon required"
    - "One action per topic, not an overwhelming checklist"

spec:
  provides:
    dynamic_agents:
      - id: compliance-guide
        name: "Compliance Guide"
        capabilities:
          - obligation_discovery
          - evidence_tracking
          - deadline_alerts
        prompt: |
          You help SMEs understand what compliance topics apply to their business.
          Use plain English. Never give legal advice — guide users to practical next steps.

  config:
    default_automation_level: assisted
