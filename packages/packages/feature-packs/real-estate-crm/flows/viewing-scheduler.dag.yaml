id: viewing-scheduler
description: "Coordinate property viewings between leads and agents"
displayName: "Viewing Scheduler"

nodes:
  # Entry
  - id: request
    type: trigger
    event: viewing.requested
    description: "Lead requests property viewing"

  # Check availability
  - id: check_availability
    type: agent
    agent: crm
    action: check_calendar_slots
    description: "Find 3 available slots"
    timeout: 10s

  # Send options to lead
  - id: send_options
    type: agent
    agent: crm
    action: send_confirmation_options
    description: "Send calendar link with available slots"

  # Wait for response
  - id: await_response
    type: wait
    timeout: 24h
    on_timeout: send_reminder

  # Lead confirms
  - id: schedule_viewing
    type: agent
    agent: crm
    action: create_calendar_event
    description: "Book the confirmed time slot"

  # Prepare materials
  - id: prepare_materials
    type: agent
    agent: crm
    action: prepare_viewing_materials
    description: "Generate property packet and directions"

  # Automated reminders
  - id: reminder_24h
    type: scheduled
    trigger: "24h_before_event"
    action: send_reminder
    agent: crm

  - id: reminder_1h
    type: scheduled
    trigger: "1h_before_event"
    action: send_final_reminder
    agent: crm

  # Post-viewing follow-up
  - id: post_viewing_followup
    type: scheduled
    trigger: "2h_after_event"
    action: send_feedback_request
    agent: crm

  # Handle no-show
  - id: no_show_check
    type: scheduled
    trigger: "30m_after_event"
    action: check_attendance
    agent: crm

  - id: no_show_recovery
    type: agent
    agent: crm
    action: initiate_no_show_recovery
    condition: attendance == false

edges:
  - from: request
    to: check_availability

  - from: check_availability
    to: send_options

  - from: send_options
    to: await_response

  - from: await_response
    to: schedule_viewing
    condition: confirmed

  - from: schedule_viewing
    to: prepare_materials

  # Reminder triggers
  - from: schedule_viewing
    to: reminder_24h

  - from: reminder_24h
    to: reminder_1h

  - from: reminder_1h
    to: no_show_check

  # Outcomes
  - from: no_show_check
    to: post_viewing_followup
    condition: attended

  - from: no_show_check
    to: no_show_recovery
    condition: not_attended
