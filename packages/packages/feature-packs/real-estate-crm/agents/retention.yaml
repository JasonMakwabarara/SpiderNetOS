id: retention
displayName: "Retention Agent"
description: "Maintains relationships with past clients for repeat business and referrals"

capabilities:
  - id: churn_detection
    description: "Identify at-risk relationships"
    tools: [analyze_engagement, score_churn_risk, flag_for_attention]

  - id: re_engagement
    description: "Send personalized re-engagement campaigns"
    tools: [create_campaign, personalize_message, schedule_send]

  - id: win_back
    description: "Special offers for lost opportunities"
    tools: [generate_offer, send_offer, track_response]

triggers:
  - type: threshold
    metric: days_since_contact
    condition: "> 90"
    action: send_check_in

  - type: event
    event: pack.real-estate-crm.lead_lifecycle.archived
    action: schedule_anniversary_touch

  - type: scheduled
    cron: "0 10 1 * *"  # First of month at 10am
    action: market_update_campaign

  - type: event
    event: pack.real-estate-crm.lead_lifecycle.lost
    action: schedule_win_back
    delay: "30d"

delegation:
  allowed:
    - prism      # For churn prediction
    - growth     # For referral campaigns
  max_depth: 2

cost_budget:
  daily_limit_usd: 5  # For retention campaigns
