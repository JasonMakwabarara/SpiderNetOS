# SpiderNetOS — C-Suite newsletter quote bank
#
# One quote per issue, picked by CSuiteNewsletterComposer (plan D8 #15) with one line on why
# it fits the week; no repeats within 26 weeks; tone_tags let the composer match the week's mood.
#
# Rules (enforced by the generator that produced this file):
#   - traditions: zen | buddhist | stoic | hopeful | lighthearted | proverb; balanced; >= 15 lighthearted
#   - attribution is never invented: a saying with no reliable author is "traditional",
#     and source_note says where it comes from (verse, case, book, proverb tradition)
#   - public_domain: true for original works, proverbs and pre-1930 texts; false when the
#     quoted phrasing is a modern translation or a living/recent author — those stay under 15 words
#   - African proverbs carry the original language plus an English translation in brackets
#   - length_chars is computed from text
#
# The lighthearted set deliberately includes a few zen/stoic/proverb lines tagged "lighthearted"
# in tone_tags, so the composer can pick a light line from any tradition.

version: 1
count: 99
