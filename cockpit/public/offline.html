<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070A" />
    <title>SpiderNetOS — Offline</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        display: grid;
        place-items: center;
        background: radial-gradient(1200px 600px at 20% -10%, rgba(0, 229, 200, 0.12), transparent 60%),
          linear-gradient(180deg, #05070a, #0a0d12);
        color: #ecf2f5;
        font-family: 'Geist', 'Inter', system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 380px;
        padding: 40px 32px;
        border: 1px solid #2a3342;
        border-radius: 16px;
        background: rgba(15, 20, 28, 0.85);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      h1 { font-size: 18px; font-weight: 600; margin: 20px 0 8px; letter-spacing: -0.01em; }
      p { font-size: 14px; color: #96a1b2; line-height: 1.55; }
      button {
        margin-top: 24px;
        padding: 10px 22px;
        font: inherit;
        font-weight: 600;
        font-size: 14px;
        color: #05070a;
        background: #00e5c8;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover { background: #17dfc3; }
      .dot { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </head>
  <body>
    <div class="card">
      <svg width="56" height="56" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="sn-off" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FF6B2C" />
            <stop offset="1" stop-color="#00D6C9" />
          </linearGradient>
        </defs>
        <circle class="dot" cx="16" cy="16" r="3" fill="url(#sn-off)" />
        <g stroke="url(#sn-off)" stroke-width="1.4" stroke-linecap="round" opacity="0.9">
          <line x1="16" y1="16" x2="6" y2="6" /><line x1="16" y1="16" x2="26" y2="6" />
          <line x1="16" y1="16" x2="6" y2="26" /><line x1="16" y1="16" x2="26" y2="26" />
          <line x1="16" y1="16" x2="16" y2="2" /><line x1="16" y1="16" x2="16" y2="30" />
          <line x1="16" y1="16" x2="2" y2="16" /><line x1="16" y1="16" x2="30" y2="16" />
        </g>
      </svg>
      <h1>You're offline</h1>
      <p>The cockpit can't reach the SpiderNet. Your agents keep working server-side — reconnect to pick up where you left off.</p>
      <button onclick="location.reload()">Retry connection</button>
    </div>
  </body>
</html>
