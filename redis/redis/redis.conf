# Redis Configuration with TLS and Security
# SpiderNet OS - Cache Security Settings

# Basic Settings
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300

# TLS Configuration
tls-port 6380
tls-cert-file /tls/redis.crt
tls-key-file /tls/redis.key
tls-ca-cert-file /tls/ca.crt
tls-auth-clients no
tls-replication yes

# Security
requirepass redis_secure_password_2026
protected-mode yes
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice
logfile ""

# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command SHUTDOWN SHUTDOWN_REDIS
rename-command CONFIG CONFIG_REDIS

# Performance
tcp-backlog 511
databases 16

# Append Only File
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec