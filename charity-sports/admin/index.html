<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charity Sports — admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4 19a9 9 0 1 1 16 0"/><path d="m12 14 4-4"/><circle cx="12" cy="15" r="1.4"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.3C6.6 16.2 4 13.3 4 10.1A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 3.1c0 3.2-2.6 6.1-8 10.2Z"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.2" y="5" width="17.6" height="16" rx="2.4"/><path d="M3.2 10h17.6M8 3v4M16 3v4"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.5 2.7 5.5 6 .9-4.3 4.2 1 6-5.4-2.8-5.4 2.8 1-6L3.3 9.9l6-.9Z"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.4"/><circle cx="8.5" cy="10" r="1.6"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M4.5 4.5l1.9 1.9M17.6 17.6l1.9 1.9M2.8 12h2.6M18.6 12h2.6M4.5 19.5l1.9-1.9M17.6 6.4l1.9-1.9"/></symbol>
  <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M2.8 20a6.2 6.2 0 0 1 12.4 0"/><path d="M16.5 5.2a3.4 3.4 0 0 1 0 6.6M17.5 14.4A6.2 6.2 0 0 1 21.2 20"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6.5h12M8 12h12M8 17.5h12M4 6.5h.01M4 12h.01M4 17.5h.01"/></symbol>
  <symbol id="i-hand" viewBox="0 0 24 24"><path d="M9 11V5.5a1.6 1.6 0 0 1 3.2 0V11"/><path d="M12.2 10.5V4.6a1.6 1.6 0 0 1 3.2 0V11"/><path d="M15.4 11V6.8a1.6 1.6 0 0 1 3.2 0V14a7 7 0 0 1-7 7h-.8a6 6 0 0 1-5.2-3l-2-3.4a1.6 1.6 0 0 1 2.5-2L9 15"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M14 4h4.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H14"/><path d="M9 8.5 4.5 12 9 15.5M4.5 12H15"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 13 4.5 4.5L19 7"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V6M5.5 12.5 12 6l6.5 6.5"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v13M5.5 11.5 12 18l6.5-6.5"/></symbol>
  <symbol id="i-drag" viewBox="0 0 24 24"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
</svg>

<div class="shell" id="shell">
  <aside class="sidebar">
    <div class="sidebar-top">
      <span class="sidebar-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14"></rect><circle class="bm-ring" cx="32" cy="32" r="19"></circle><path class="bm-heart" d="M32 42.5C25 37.2 21.5 33.6 21.5 29.4a5.9 5.9 0 0 1 10.5-3.7 5.9 5.9 0 0 1 10.5 3.7c0 4.2-3.5 7.8-10.5 13.1Z"></path></svg>
      </span>
      <span class="sidebar-title"><b>Charity Sports</b><span>Admin</span></span>
    </div>
    <div class="sidebar-stripe" aria-hidden="true"></div>

    <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="nav">
      <svg class="icon" aria-hidden="true"><use href="#i-list"></use></svg> Menu
    </button>

    <nav class="nav" id="nav" aria-label="Admin sections"></nav>

    <div class="sidebar-foot">
      <b id="whoName">—</b>
      <span id="whoRole"></span>
      <button class="btn btn-quiet btn-sm btn-block" type="button" id="signOut">
        <svg class="icon" aria-hidden="true"><use href="#i-out"></use></svg> Sign out
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 id="screenTitle">Dashboard</h1>
      <span class="topbar-spacer"></span>
      <span class="publish-state clean" id="publishState">Checking…</span>
      <button class="btn btn-green btn-sm" type="button" id="publishBtn">
        <svg class="icon" aria-hidden="true"><use href="#i-up"></use></svg> Publish
      </button>
      <a class="btn btn-quiet btn-sm" href="../" target="_blank" rel="noopener">
        <svg class="icon" aria-hidden="true"><use href="#i-eye"></use></svg> View site
      </a>
    </header>

    <main class="screen" id="screen">
      <p class="loading">Loading…</p>
    </main>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<dialog class="dialog" id="dialog" aria-labelledby="dialogTitle">
  <form method="dialog" class="dialog-body">
    <h2 id="dialogTitle">Are you sure?</h2>
    <div id="dialogBody"></div>
    <div class="dialog-actions">
      <button class="btn btn-quiet" value="cancel" type="submit" id="dialogCancel">Cancel</button>
      <button class="btn btn-danger" value="confirm" type="submit" id="dialogConfirm">Yes, do it</button>
    </div>
  </form>
</dialog>

<script defer src="js/api.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/fields.js"></script>
<script defer src="js/form.js"></script>
<script defer src="js/upload.js"></script>
<script defer src="js/list.js"></script>
<script defer src="js/screens/dashboard.js"></script>
<script defer src="js/screens/section.js"></script>
<script defer src="js/screens/collection.js"></script>
<script defer src="js/screens/users.js"></script>
<script defer src="js/screens/audit.js"></script>
<script defer src="js/screens/password.js"></script>
<script defer src="js/app.js"></script>
</body>
</html>
