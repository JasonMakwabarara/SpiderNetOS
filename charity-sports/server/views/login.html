<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Charity Sports admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../admin/admin.css">
</head>
<body class="login-page">
<main class="login-card">
  <header class="login-head">
    <span class="login-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14"></rect><circle class="bm-ring" cx="32" cy="32" r="19"></circle><path class="bm-heart" d="M32 42.5C25 37.2 21.5 33.6 21.5 29.4a5.9 5.9 0 0 1 10.5-3.7 5.9 5.9 0 0 1 10.5 3.7c0 4.2-3.5 7.8-10.5 13.1Z"></path></svg>
    </span>
    <h1>Charity Sports</h1>
    <p>Sign in to edit the website.</p>
  </header>

  <form class="login-form" method="post" action="../api/auth/login" id="loginForm" novalidate>
    <input type="hidden" name="_csrf" value="__CSRF_TOKEN__">

    <p class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username"
             autocapitalize="none" spellcheck="false" required autofocus>
    </p>

    <p class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </p>

    <p class="form-error" id="loginError" role="alert" hidden></p>

    <button class="btn btn-primary btn-block" type="submit" id="loginSubmit">Sign in</button>
  </form>

  <footer class="login-foot">
    <p>Lost the password? Whoever runs the server can reset it with
       <code>npm run reset-password</code>.</p>
    <p><a href="../">Back to the website</a></p>
  </footer>
</main>
<script defer src="../admin/js/login.js"></script>
</body>
</html>
