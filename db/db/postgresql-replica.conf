# PostgreSQL Replica Configuration
# SpiderNet OS - Read Replica

# Basic Settings
listen_addresses = '*'
port = 5432
max_connections = 100
shared_preload_libraries = 'pg_stat_statements,pgcrypto'
pg_stat_statements.track = all

# Memory Settings (lower for replica)
shared_buffers = 128MB
effective_cache_size = 512MB
work_mem = 2MB
maintenance_work_mem = 32MB

# WAL Settings
wal_level = replica
hot_standby = on
hot_standby_feedback = on

# SSL/TLS Configuration
ssl = on
ssl_cert_file = '/var/lib/postgresql/ssl/server.crt'
ssl_key_file = '/var/lib/postgresql/ssl/server.key'
ssl_ca_file = '/var/lib/postgresql/ssl/ca.crt'
ssl_ciphers = 'HIGH:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!PSK:!SRP:!CAMELLIA'

# Authentication
password_encryption = scram-sha-256
authentication_timeout = 60s

# Logging
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_statement = 'ddl'
log_duration = on

# Security
row_security = on

# Performance
random_page_cost = 1.1
effective_io_concurrency = 200

# Extensions
shared_preload_libraries = 'pg_stat_statements,pgcrypto,pgvector'