# PostgreSQL Configuration with Encryption and SSL
# SpiderNet OS - Production Security Settings

# Basic Settings
listen_addresses = '*'
port = 5432
max_connections = 100
shared_preload_libraries = 'pg_stat_statements,pgcrypto'
pg_stat_statements.track = all

# Memory Settings
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 4MB
maintenance_work_mem = 64MB

# WAL Settings
wal_level = replica
max_wal_senders = 3
wal_keep_size = 64MB

# SSL/TLS Configuration
ssl = on
ssl_cert_file = '/var/lib/postgresql/ssl/server.crt'
ssl_key_file = '/var/lib/postgresql/ssl/server.key'
ssl_ca_file = '/var/lib/postgresql/ssl/ca.crt'
ssl_ciphers = 'HIGH:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!PSK:!SRP:!CAMELLIA'

# Authentication
password_encryption = scram-sha-256
authentication_timeout = 60s

# Logging
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_statement = 'ddl'
log_duration = on
log_lock_waits = on
log_temp_files = 0

# Security
row_security = on

# Performance
random_page_cost = 1.1
effective_io_concurrency = 200

# Extensions
shared_preload_libraries = 'pg_stat_statements,pgcrypto,pgvector'