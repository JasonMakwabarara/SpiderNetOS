id: crm
displayName: "CRM Agent"
description: "Manages lead pipeline and agent coordination"

capabilities:
  - id: lead_scoring
    description: "Score leads by conversion probability"
    tools: [calculate_score, update_profile, add_tags]

  - id: follow_ups
    description: "Time and send follow-up messages"
    tools: [schedule_followup, send_message, track_response]

  - id: viewing_coordination
    description: "Schedule and confirm property viewings"
    tools: [check_availability, send_invite, confirm_booking, send_reminder]

  - id: offer_tracking
    description: "Track offers from submission to response"
    tools: [log_offer, update_status, notify_parties]

triggers:
  - type: event
    event: pack.real-estate-crm.lead_lifecycle.captured
    action: score_and_route

  - type: threshold
    metric: response_time_p50
    condition: "> 5m"
    action: escalate_to_alerts

  - type: event
    event: pack.real-estate-crm.lead_lifecycle.scheduled
    action: prepare_viewing_materials

  - type: scheduled
    cron: "0 8,14 * * *"  # Twice daily
    action: process_pending_followups

delegation:
  allowed:
    - prism      # For lead scoring models
    - nexus      # For execution
    - atlas      # For escalation to executive
  max_depth: 3

cost_budget:
  daily_limit_usd: 10  # For SMS/WhatsApp costs
