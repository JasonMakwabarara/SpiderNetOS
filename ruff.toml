[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106"]

[tool.ruff.lint]
extend-select = ["B", "C4", "SIM"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "D104"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
