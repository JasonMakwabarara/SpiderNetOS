server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — re-resolve upstream hostnames (avoids stale api → wrong container).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cockpit hashed assets — must 404 when missing (never fall back to index.html),
    # otherwise a stale cached index.html silently receives HTML instead of JS and the
    # SPA fails to mount (router then lands on #/404).
    location /cockpit/assets/ {
        alias /usr/share/nginx/html/cockpit/assets/;
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cockpit index.html — never cache, so the browser always loads the current bundle.
    location = /cockpit/index.html {
        alias /usr/share/nginx/html/cockpit/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Vue cockpit static bundle (hash router, base /cockpit/)
    location /cockpit/ {
        alias /usr/share/nginx/html/cockpit/;
        try_files $uri $uri/ /cockpit/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Laravel intelligence proxy (V1 -> V2 bridge)
    location /api/v2/intelligence/ {
        set $upstream_laravel http://api:8000;
        proxy_pass $upstream_laravel;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # V2 intelligence layer (semantic gateway)
    location /api/v2/ {
        rewrite ^/api/v2/(.*)$ /v2/$1 break;
        set $upstream_v2 http://semantic-gateway:8000;
        proxy_pass $upstream_v2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Landing enterprise auth + SCIM (FastAPI cockpit-api)
    location ~ ^/api/(enterprise|scim)/ {
        set $upstream_enterprise http://cockpit-api:8001;
        proxy_pass $upstream_enterprise;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Laravel V1 business API (agents, flows, atlas, auth, STE)
    location /api/ {
        set $upstream_laravel http://api:8000;
        proxy_pass $upstream_laravel;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React landing SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
