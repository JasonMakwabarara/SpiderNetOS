---
# Edge rate limits (per source IP). These sit IN FRONT of Laravel's
# throttle:<tier> middleware, absorbing abusive traffic before it enters
# the app. Burst values are ~2× average to allow normal bursty UI traffic.
#
# Ingress routes attach the appropriate middleware via the annotation:
#   traefik.ingress.kubernetes.io/router.middlewares: >
#     spidernet-rl-auth@kubernetescrd

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rl-auth
  namespace: spidernet
spec:
  rateLimit:
    average: 5
    burst: 10
    period: 1m
    sourceCriterion:
      ipStrategy:
        depth: 1         # peel one XFF hop (Hetzner LB)
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rl-api
  namespace: spidernet
spec:
  rateLimit:
    average: 60
    burst: 120
    period: 1m
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rl-admin
  namespace: spidernet
spec:
  rateLimit:
    average: 30
    burst: 60
    period: 1m
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rl-platform
  namespace: spidernet
spec:
  rateLimit:
    average: 20
    burst: 40
    period: 1m
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rl-voice-webhook
  namespace: spidernet
spec:
  rateLimit:
    average: 600
    burst: 1200
    period: 1m
    sourceCriterion:
      ipStrategy:
        depth: 1
