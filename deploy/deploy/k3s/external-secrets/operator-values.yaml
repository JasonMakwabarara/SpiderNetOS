# Helm values for external-secrets/external-secrets
# Applied to the `external-secrets-system` namespace during Tier 2 bring-up.

replicaCount: 1

installCRDs: true

# Resources are modest; ESO is a controller, not a data-plane component.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

serviceMonitor:
  enabled: true   # Prometheus scrape (Grafana Cloud via remote-write)

webhook:
  replicaCount: 1

certController:
  replicaCount: 1

# Restrict watched namespaces to SpiderNet only (defence in depth).
scopedNamespace: ""         # empty = cluster-wide; tighten post-bring-up
scopedRBAC: false

# Leader election for HA once we bump replicaCount.
leaderElect: true
