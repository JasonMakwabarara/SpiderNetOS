---
# ClusterSecretStore: makes Vault available as an ESO backend for every namespace.
# Uses the Kubernetes auth method — no static tokens in-cluster.

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-spidernet
spec:
  provider:
    vault:
      server: https://vault.spidernet.internal:8200
      path: kv                       # KV v2 mount
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: spidernet-app        # Vault role bound to the k8s ServiceAccount below
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets-system
      caProvider:
        type: ConfigMap
        namespace: external-secrets-system
        name: vault-ca
        key: ca.crt
