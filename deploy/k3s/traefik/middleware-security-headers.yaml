---
# Security header middleware — complements the Laravel
# SecurityHeadersMiddleware. Traefik strips `Server` and `X-Powered-By`
# (which Laravel/PHP add before our middleware chain runs) and enforces
# HSTS / frame-ancestors at the edge.

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: spidernet
spec:
  headers:
    # Strip leaky headers
    customResponseHeaders:
      Server: ""
      X-Powered-By: ""

    # Enforce at edge (redundant with Laravel, defence in depth)
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: false
    forceSTSHeader: true

    frameDeny: true
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: "strict-origin-when-cross-origin"
    permissionsPolicy: "camera=(), microphone=(self), geolocation=(), payment=(), usb=()"

    # Explicit cross-origin policies (COOP / CORP already set by Laravel,
    # re-asserted here so Traefik-cached responses also carry them)
    customFrameOptionsValue: "DENY"
