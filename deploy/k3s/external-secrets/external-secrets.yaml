---
# One ExternalSecret per logical bundle. Each materialises a native `Secret`
# in the `spidernet` namespace that Deployments reference via `envFrom`.
# Refresh interval is 15m — fast enough that rotations propagate within a
# single runbook grace window.

# ─── App-level secrets (APP_KEY, previous keys) ──────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: spidernet-app
  namespace: spidernet
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-spidernet
  target:
    name: spidernet-app
    creationPolicy: Owner
  data:
    - secretKey: APP_KEY
      remoteRef:
        key: spidernet/app
        property: app_key
    - secretKey: APP_PREVIOUS_KEYS
      remoteRef:
        key: spidernet/app
        property: app_previous_keys
---
# ─── Database ────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: spidernet-db
  namespace: spidernet
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-spidernet
